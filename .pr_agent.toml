[config]
model = "llama3.1-70b"
fallback_models = ["llama3.1-70b"]
verbosity = 2

[pr_reviewer]
auto_review = true
require_all_thresholds_for_review = false
num_code_suggestions = 3
inline_code_comments = true
require_focused_review = false
require_security_review = true
require_score = true
require_estimate_effort_to_review = true
enable_review_labels_effort = true
enable_review_labels_security = true
extra_instructions = "Focus on: 1) Breaking changes 2) Security issues 3) Bug potential 4) MERN stack issues. Always provide clear explanations and risk assessment."

[pr_code_suggestions]
auto_improve = true
num_code_suggestions = 2
summarize = true
extra_instructions = "Prioritize: 1) Runtime errors 2) Security vulnerabilities 3) Performance issues 4) Best practices"

[github]
publish_output = true
publish_review = true
incremental_review = false