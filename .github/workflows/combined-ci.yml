name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - run: npm run format

      - name: Check formatting
        run: |
          # Fail the job if formatting made changes. Contributors should run
          # `npm run format` locally and push the formatted code.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Formatting produced changes. Run 'npm run format' locally and push the changes."
            git --no-pager status --porcelain
            exit 1
          else
            echo "No formatting changes."
          fi

  semgrep:
    needs: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/ci'

  build:
    needs: semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      - name: Run Lint
        run: npm run lint || true

      - name: Build Project
        run: npm run build

  codeql:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
