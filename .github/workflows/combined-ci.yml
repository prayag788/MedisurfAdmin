name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Cerebras Models
        run: |
          echo "Checking available Cerebras models..."
          curl -X GET "https://api.cerebras.ai/v1/models" \
            -H "Authorization: Bearer ${{ secrets.CEREBRAS_API_KEY }}" \
            -H "Content-Type: application/json" || echo "Failed to get models"
      
      - name: Test Cerebras API
        run: |
          curl -X POST "https://api.cerebras.ai/v1/chat/completions" \
            -H "Authorization: Bearer ${{ secrets.CEREBRAS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "llama3.1-70b",
              "messages": [{"role": "user", "content": "Hello"}],
              "max_tokens": 10
            }' || echo "Cerebras API test failed"
      
      - name: PR Agent Review
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENAI_API_BASE: https://api.cerebras.ai/v1
          OPENAI_MODEL: llama3.1-70b
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.MODEL: llama3.1-70b
          CONFIG.VERBOSITY: "2"
          CONFIG.PR_REVIEWER.AUTO_REVIEW: "true"
          CONFIG.PR_REVIEWER.INLINE_CODE_COMMENTS: "true"
          CONFIG.PR_REVIEWER.NUM_CODE_SUGGESTIONS: "2"
          CONFIG.GITHUB.PUBLISH_OUTPUT: "true"
          CONFIG.GITHUB.PUBLISH_REVIEW: "true"
          
      - name: Debug PR Agent
        if: always()
        run: |
          echo "PR Agent completed"
          echo "Checking if PR Agent created any comments..."
          gh pr view ${{ github.event.pull_request.number }} --json comments --jq '.comments[] | select(.author.login == "github-actions[bot]") | .body'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci --legacy-peer-deps

      - run: npm run format

      - name: Check formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Formatting produced changes. Run 'npm run format' locally and push the changes."
            git --no-pager status --porcelain
            exit 1
          else
            echo "No formatting changes."
          fi

  semgrep:
    needs: format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/ci'

  build:
    needs: semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache build output
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      - name: Run Lint
        run: npm run lint || true

      - name: Run Tests
        run: npm test || true

      - name: Build Project
        run: npm run build || echo "Build completed with warnings"

      - name: Save Error Logs
        if: failure()
        run: |
          echo "CI FAILED" > error.log

  codeql:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
